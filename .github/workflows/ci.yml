name: Shopora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.0

      - name: Scan repository history for secrets
        id: gitleaks
        continue-on-error: true
        run: |
          "$(go env GOPATH)/bin/gitleaks" detect --source . --report-format sarif --report-path gitleaks.sarif --exit-code 1

      - name: Upload Gitleaks findings to code scanning
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@5895b2c9be147bc7f1c75ce72c5cb577febb1907 # v4
        with:
          sarif_file: gitleaks.sarif

      - name: Fail if Gitleaks found secrets
        if: steps.gitleaks.outcome == 'failure'
        run: exit 1

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build app
        run: npm run build

      - name: Generate CycloneDX SBOM
        run: npm sbom --sbom-format cyclonedx > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shopora-sbom
          path: sbom.json
          if-no-files-found: error

      - name: Audit production dependencies
        run: npm audit --omit=dev
