name: Shopora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript
        run: npm run typecheck

      - name: Build app
        run: npm run build

      # Temporary: the current baseline has known audit findings.
      - name: Report production dependency vulnerabilities
        run: npm audit --omit=dev
        continue-on-error: true
